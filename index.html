<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAVANAGH.DK</title>
    <meta name="description" content="KAVANAGH.DK - An immersive digital experience with drifting emerald clouds and interactive elements.">
    <meta property="og:title" content="KAVANAGH.DK">
    <meta property="og:description" content="An immersive digital experience with drifting emerald clouds and interactive elements.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2310b981'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
        <h1 class="title">KAVANAGH.DK</h1>
    </div>
    <script>
        // Cursor trail
        document.addEventListener('mousemove', (e) => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            
            setTimeout(() => trail.remove(), 1000);
        });

        // Click to spawn orb
        document.addEventListener('click', (e) => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            
            const orb = document.createElement('div');
            orb.className = 'spawn-orb';
            const size = Math.random() * 100 + 80;
            orb.style.width = size + 'px';
            orb.style.height = size + 'px';
            orb.style.left = (e.clientX - size / 2) + 'px';
            orb.style.top = (e.clientY - size / 2) + 'px';
            document.body.appendChild(orb);
            
            setTimeout(() => orb.remove(), 3000);
        });

        // Random stars
        function createStar() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.querySelector('.container').appendChild(star);
            
            setTimeout(() => star.remove(), 6000);
        }

        setInterval(createStar, 500);

        // Title flicker in browser tab
        let originalTitle = 'KAVANAGH.DK';
        let glitchTitle = 'K∆V∆N∆GH.DK';
        setInterval(() => {
            if (Math.random() > 0.95) {
                document.title = glitchTitle;
                setTimeout(() => {
                    document.title = originalTitle;
                }, 100);
            }
        }, 2000);
    </script>
</body>
</html>
